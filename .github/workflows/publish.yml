# Publishes the scheduled guides/tools (src/content/pages.py) on their dates.
# Every morning it rebuilds the site; if a page's publish date has arrived it
# appears, the sitemap updates, and Bing/Yandex are told via IndexNow.
# Google picks new pages up from the sitemap in Search Console.
name: Publish scheduled pages
on:
  schedule:
    - cron: "7 11 * * *"   # 11:07 UTC daily (~noon UK, ~7am Toronto)
    # GitHub sometimes skips scheduled runs; a second one later in the day
    # catches up (it changes nothing when the day's pages are already out).
    - cron: "43 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site for today
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cp published.txt /tmp/before.txt 2>/dev/null || touch /tmp/before.txt
          python3 src/build.py
      - name: Commit and push if anything is new
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish scheduled pages ($(date -u +%F))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Make sure GitHub Pages redeploys
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made by this workflow's own token don't always start a
          # Pages build, so ask for one (harmless if one is already running).
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
      - name: Tell search engines (IndexNow)
        if: steps.commit.outputs.changed == 'true'
        run: |
          comm -13 <(sort /tmp/before.txt) <(sort published.txt) > /tmp/new.txt
          if [ ! -s /tmp/new.txt ]; then exit 0; fi
          sleep 120   # let GitHub Pages deploy first
          KEY=$(cat src/indexnow-key)
          python3 - "$KEY" <<'PY'
          import json, sys, urllib.request
          key = sys.argv[1]
          urls = [u.strip() for u in open("/tmp/new.txt") if u.strip()] + ["https://getontap.net/sitemap.xml"]
          body = json.dumps({"host": "getontap.net", "key": key,
                             "keyLocation": f"https://getontap.net/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, urls)
          except Exception as e:
              print("IndexNow failed (not fatal):", e)
          PY
